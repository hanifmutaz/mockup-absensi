const BULAN_ID = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const HARI_ID = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const pad2 = (n) => String(n).padStart(2, "0");
function toISO(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function fromISO(s) { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function tglPendek(s) { if(!s) return "-"; const d=fromISO(s); return `${pad2(d.getDate())} ${BULAN_ID[d.getMonth()].slice(0,3)} ${d.getFullYear()}`; }
function tglPanjang(s) { if(!s) return "-"; const d=fromISO(s); return `${HARI_ID[d.getDay()]}, ${pad2(d.getDate())} ${BULAN_ID[d.getMonth()]} ${d.getFullYear()}`; }
function tglRingkas(s) { if(!s) return "-"; const d=fromISO(s); return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`; }
function tglStrip(s) { return s ? s.split("-").reverse().join("-") : ""; }
function isMinggu(s) { return fromISO(s).getDay() === 0; }
function jamKeMenit(t) { if(!t) return null; const p=t.split(":").map(Number); return p[0]*60 + (p[1]||0); }
function selisihMenit(a, b) { if(a==null||b==null) return 0; let d=b-a; if(d < -180) d += 1440; return d; }
function jamDesimal(menit) { return Math.round((menit/60)*100)/100; }
function jamTitik(t) { return t ? String(t).slice(0,5).replace(":", ".") : ""; }
function daftarTanggal(dari, sampai) {
  const out=[]; const a=fromISO(dari), b=fromISO(sampai);
  for(let d=new Date(a); d<=b; d.setDate(d.getDate()+1)) out.push(toISO(d));
  return out;
}
function awalBulan(iso) { const d=fromISO(iso); return toISO(new Date(d.getFullYear(), d.getMonth(), 1)); }
function akhirBulan(iso) { const d=fromISO(iso); return toISO(new Date(d.getFullYear(), d.getMonth()+1, 0)); }
function inisial(nama) { return (nama||"").split(" ").filter(Boolean).slice(0,2).map(s=>s[0]).join("").toUpperCase(); }
function esc(s) { if(s==null) return ""; return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function potongHal(list, hal, per) { return list.slice((hal-1)*per, (hal-1)*per+per); }
function rupiah(n) { if(!n) return "0"; return new Intl.NumberFormat("id-ID").format(Math.round(n)); }
/** Tampilan jam: 7,25 (kosong ditandai tanda hubung biasa, bukan garis panjang). */
function jamFmt(n) { if(!n) return "-"; return Number(n).toFixed(2).replace(/\.?0+$/,"").replace(".",","); }
function acakStabil(kunci) {
  let h=2166136261;
  for(let i=0;i<kunci.length;i++){ h^=kunci.charCodeAt(i); h=Math.imul(h,16777619); }
  return (h>>>0)/4294967296;
}

/* ---------- Pembacaan CSV ---------- */
function parseCSV(teks) {
  const baris = teks.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n").filter(b=>b.trim()!=="");
  if(!baris.length) return { header: [], rows: [] };
  const pisah = (b) => {
    const out=[]; let cur=""; let q=false;
    for(let i=0;i<b.length;i++){
      const c=b[i];
      if(q){ if(c==='"'&&b[i+1]==='"'){cur+='"';i++;} else if(c==='"'){q=false;} else cur+=c; }
      else if(c==='"') q=true;
      else if(c===","||c===";"||c==="\t"){ out.push(cur); cur=""; }
      else cur+=c;
    }
    out.push(cur); return out.map(x=>x.trim());
  };
  const header = pisah(baris[0]).map(h=>h.replace(/^\ufeff/,""));
  const rows = baris.slice(1).map(b=>{ const s=pisah(b), o={}; header.forEach((h,i)=>{o[h]=s[i]??"";}); return o; });
  return { header, rows };
}
function unduhBlob(namaFile, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=namaFile;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

/* ============================================================
   PENULIS BERKAS EXCEL (.xlsx)
   Berkas xlsx pada dasarnya adalah arsip ZIP berisi berkas XML.
   Ditulis langsung tanpa pustaka tambahan agar aplikasi tetap
   berupa satu berkas dan dapat dipakai tanpa koneksi internet.
   ============================================================ */

/* --- Perhitungan CRC-32 untuk entri ZIP --- */
const CRC_TABEL = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABEL[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
const teksKeBytes = (s) => new TextEncoder().encode(s);

/** Membuat arsip ZIP (metode simpan/tanpa kompresi) dari daftar berkas. */
function buatZip(berkas) {
  const enc = berkas.map(f => ({ nama: teksKeBytes(f.nama), isi: teksKeBytes(f.isi) }));
  const lokal = [], pusat = [];
  let offset = 0;
  enc.forEach(f => {
    const crc = crc32(f.isi), n = f.nama.length, s = f.isi.length;
    const lh = new Uint8Array(30 + n);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, 0, true); dv.setUint16(12, 0, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, s, true); dv.setUint32(22, s, true);
    dv.setUint16(26, n, true); dv.setUint16(28, 0, true);
    lh.set(f.nama, 30);
    lokal.push(lh, f.isi);

    const ch = new Uint8Array(46 + n);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, s, true); cv.setUint32(24, s, true);
    cv.setUint16(28, n, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    ch.set(f.nama, 46);
    pusat.push(ch);
    offset += lh.length + s;
  });
  const awalPusat = offset;
  let ukPusat = 0; pusat.forEach(b => ukPusat += b.length);
  const akhir = new Uint8Array(22);
  const av = new DataView(akhir.buffer);
  av.setUint32(0, 0x06054b50, true); av.setUint16(8, enc.length, true); av.setUint16(10, enc.length, true);
  av.setUint32(12, ukPusat, true); av.setUint32(16, awalPusat, true);
  return new Blob([...lokal, ...pusat, akhir], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

const escXml = (s) => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;" }[c]));
function namaKolom(i) { let s = ""; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }

/**

 * Sel boleh berupa angka, teks, atau { v, gaya }.
 */
function unduhExcel(namaFile, lembar) {
  /* Gaya: 0 biasa | 1 judul | 2 kepala | 3 total | 4 angka | 5 total angka | 6 teks tengah */
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">

<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="7">
<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1"/>

</cellXfs>

</styleSheet>`;

  const sheets = lembar.map((L, idx) => {
    const cols = L.lebar && L.lebar.length
      ? `<cols>${L.lebar.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols>` : "";
    const rows = L.baris.map((b, r) => {
      const sel = b.map((c, k) => {
        const objek = c && typeof c === "object" && !Array.isArray(c);
        const nilai = objek ? c.v : c;
        const gaya = objek ? (c.gaya || 0) : 0;
        const ref = `${namaKolom(k)}${r+1}`;
        if (nilai === "" || nilai == null) return gaya ? `<c r="${ref}" s="${gaya}"/>` : "";
        if (typeof nilai === "number" && Number.isFinite(nilai))
          return `<c r="${ref}" s="${gaya}"><v>${nilai}</v></c>`;
        return `<c r="${ref}" s="${gaya}" t="inlineStr"><is><t xml:space="preserve">${escXml(nilai)}</t></is></c>`;
      }).join("");
      return `<row r="${r+1}">${sel}</row>`;
    }).join("");
    const beku = L.beku ? `<sheetViews><sheetView workbookViewId="0"><pane ySplit="${L.beku}" topLeftCell="A${L.beku+1}" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>` : "";
    return { idx, nama: L.nama, xml: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

</Types>` },
    { nama: "_rels/.rels", isi: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>` },
    { nama: "xl/workbook.xml", isi: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

</workbook>` },
    { nama: "xl/_rels/workbook.xml.rels", isi: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${sheets.map(s=>`<Relationship Id="rId${s.idx+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${s.idx+1}.xml"/>`).join("")}
<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>` },
    { nama: "xl/styles.xml", isi: styles },
    ...sheets.map(s => ({ nama: `xl/worksheets/sheet${s.idx+1}.xml`, isi: s.xml })),
  ];
  unduhBlob(namaFile, buatZip(berkas));
}

/** Cetak tabel lewat jendela baru (alternatif berkas PDF). */
function cetakTabel(judul, subjudul, header, baris, footer) {
  const w = window.open("", "_blank", "width=1180,height=780");
  if(!w) return false;
  const th = header.map(h=>`<th>${esc(h)}</th>`).join("");
  const tb = baris.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("");
  const tf = footer ? `<tfoot><tr>${footer.map(c=>`<td><b>${esc(c)}</b></td>`).join("")}</tr></tfoot>` : "";
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(judul)}</title><style>
    *{box-sizing:border-box} body{font-family:Arial,Helvetica,sans-serif;padding:26px;color:#0f172a}
    h1{font-size:16px;margin:0 0 4px} p.sub{font-size:11px;color:#64748b;margin:0 0 16px}
    table{width:100%;border-collapse:collapse;font-size:10px}
    th,td{border:1px solid #cbd5e1;padding:4px 6px;text-align:left}
    th{background:#f1f5f9;font-weight:700} tr:nth-child(even) td{background:#f8fafc}
    tfoot td{background:#eef2f7} @media print{body{padding:0}}
  </style></head><body><h1>${esc(judul)}</h1><p class="sub">${esc(subjudul)}</p>
  <table><thead><tr>${th}</tr></thead><tbody>${tb}</tbody>${tf}</table>
  <script>window.onload=function(){window.print()}<\/script></body></html>`);
  w.document.close(); return true;
}

/* ===== 03-engine.js ===== */
/* ============================================================
   MESIN ABSENSI
   Membaca log mesin fingerprint (berkas .dat attlog maupun .csv)
   lalu menyusunnya menjadi data absensi harian siap diverifikasi.
   ============================================================ */
function kodeTampil(kelompok, kodeDasar, daftarKelompok) {
  const k = (daftarKelompok || []).find(x => x.kode === kelompok);
  return (k ? k.prefix : "") + kodeDasar;
}
function labelKode(kelompok, kodeDasar, daftarKelompok, daftarKode) {
  const k = (daftarKelompok || []).find(x => x.kode === kelompok);
  const d = (daftarKode || []).find(x => x.kode === kodeDasar);
  return `${k ? k.nama : "Normal"} ${d ? d.nama : kodeDasar}`;
}

/** Menormalkan tanggal ke bentuk YYYY-MM-DD. */
function rapikanTanggalMentah(t) {
  if (!t) return "";
  t = t.trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
  if (/^\d{4}\/\d{1,2}\/\d{1,2}$/.test(t)) { const [y,m,d]=t.split("/"); return `${y}-${pad2(+m)}-${pad2(+d)}`; }
  if (/^\d{1,2}[\/-]\d{1,2}[\/-]\d{4}$/.test(t)) { const [d,m,y]=t.split(/[\/-]/); return `${y}-${pad2(+m)}-${pad2(+d)}`; }
  return "";
}
function rapikanJamMentah(j) {
  if (!j) return "";
  const p = j.trim().split(":");
  if (p.length < 2) return "";
  return `${pad2(+p[0])}:${pad2(+p[1])}:${pad2(+(p[2]||0))}`;
}

function rapikanTanggal(t) {
  const h = rapikanTanggalMentah(t); if (!h) return "";
  const [, m, d] = h.split("-").map(Number);
  return m >= 1 && m <= 12 && d >= 1 && d <= 31 ? h : "";
}
function rapikanJam(j) {
  const h = rapikanJamMentah(j); if (!h) return "";
  const [jj, mm, ss] = h.split(":").map(Number);
  return jj <= 23 && mm <= 59 && ss <= 59 ? h : "";
}

/** Membaca berkas attlog mesin (dipisah tab atau spasi, tanpa baris kepala). */
function bacaAttlog(teks) {
  const baris = teks.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n");
  const log = []; let dilewati = 0;
  baris.forEach(b => {
    const t = b.replace(/^\ufeff/, "").trim();
    if (!t) return;
    const k = t.split(/\t+|\s{2,}|\s+/).filter(x => x !== "");
    if (k.length < 2) { dilewati++; return; }
    const pin = k[0];
    if (!/^\d+$/.test(pin)) { dilewati++; return; }
    const tgl = rapikanTanggal(k[1]);
    const jam = rapikanJam(k[2] || "");
    if (!tgl || !jam) { dilewati++; return; }
    // Susunan lazim: PIN, tanggal, jam, mesin, status, verifikasi, workcode
    const statusMentah = k[4] != null ? String(k[4]) : "";
    const metodeMentah = k[5] != null ? String(k[5]) : "";
    log.push({
      pin, nama: "", tanggal: tgl, jam, menit: jamKeMenit(jam),
      status: STATUS_MESIN[statusMentah] || (statusMentah === "" ? "Scan" : "Scan"),
      metode: METODE_MESIN[metodeMentah] || "",
    });
  });
  return { log, dilewati };
}

/** Membaca berkas CSV berkepala (hasil konversi perangkat lunak mesin). */
function bacaCSVMesin(rows) {
  const log = []; let dilewati = 0;
  rows.forEach(r => {
    const pin = String(r.PIN ?? r.pin ?? r.NIK ?? "").trim();
    if (!pin) { dilewati++; return; }
    let tgl = rapikanTanggal(String(r.Date ?? "").trim());
    let jam = rapikanJam(String(r.Time ?? "").trim());
    const dt = String(r.DateTime ?? "").trim();
    if ((!tgl || !jam) && dt) { const [a,b] = dt.split(" "); tgl = tgl || rapikanTanggal(a); jam = jam || rapikanJam(b); }
    if (!tgl || !jam) { dilewati++; return; }
    log.push({ pin, nama: String(r.Name ?? "").trim(), tanggal: tgl, jam, menit: jamKeMenit(jam),
      status: String(r.Status ?? "Scan").trim() || "Scan", metode: String(r.VerifyMethod ?? "").trim() });
  });
  return { log, dilewati };
}

/** Pintu masuk pembacaan berkas: mengenali sendiri bentuk berkasnya. */
function parseLogMesin(teks) {
  const bersih = (teks || "").replace(/^\ufeff/, "").trim();
  if (!bersih) return { log: [], meta: { format: "kosong", jumlah: 0, dilewati: 0 } };
  const barisAwal = bersih.split(/\r?\n/)[0];
  const berkepala = /pin|nik|datetime|date/i.test(barisAwal) && /[,;]/.test(barisAwal);
  const hasil = berkepala ? bacaCSVMesin(parseCSV(bersih).rows) : bacaAttlog(bersih);
  const log = hasil.log;
  log.sort((a,b) => (a.tanggal + a.jam).localeCompare(b.tanggal + b.jam));
  const status = {};
  log.forEach(s => { status[s.status] = (status[s.status] || 0) + 1; });
  return {
    log,
    meta: {
      format: berkepala ? "csv" : "attlog",
      jumlah: log.length, dilewati: hasil.dilewati,
      jumlahPin: new Set(log.map(s => s.pin)).size,
      awal: log.length ? `${log[0].tanggal} ${log[0].jam}` : "",
      akhir: log.length ? `${log[log.length-1].tanggal} ${log[log.length-1].jam}` : "",
      status, adaOT: log.some(s => /^OT/i.test(s.status)),
    },
  };
}

const tambahHari = (iso, n) => { const t = fromISO(iso); t.setDate(t.getDate() + n); return toISO(t); };
const isOT = (s) => /^OT/i.test(s);
const isIstirahat = (s) => /^Break/i.test(s);
/** 'in' | 'out' | 'x' (status tidak dikenal). */
const jenisScan = (s) => /in$/i.test(s) ? "in" : /out$/i.test(s) ? "out" : "x";
const hariMenit = (iso) => { const [y, m, d] = iso.split("-").map(Number); return Date.UTC(y, m - 1, d) / 60000; };
const menitMutlak = (s) => hariMenit(s.tanggal) + s.menit;

/* ------------------------------------------------------------
   PENYUSUNAN SESI KERJA
   Scan satu orang dikelompokkan menjadi SESI KERJA berdasarkan urutan waktu
   dan status, bukan berdasarkan tanggal kalender atau shift di data master.
   Shift malam, rotasi shift, scan ganda, dan tombol status yang tertukar
   semuanya ditangani dari pola scan itu sendiri.
   ------------------------------------------------------------ */

/** Menggabungkan scan ganda lalu memecah scan satu orang menjadi sesi kerja. */
function bentukSesi(scans, info) {
  const bersih = [];
  scans.forEach((s) => {
    const t = bersih[bersih.length - 1];
    if (t && t.status === s.status && s.abs - t.abs <= SESI.gandaMenit) {
      info.ganda++;
      // pulang: ambil scan terakhir | masuk: ambil scan pertama
      bersih[bersih.length - 1] = jenisScan(s.status) === "out" ? { ...s, ganda: t.ganda + s.ganda + 1 } : (t.ganda++, t);
      return;
    }
    bersih.push(s);
  });
  const sesi = []; let cur = [];
  bersih.forEach((s) => {
    if (cur.length) {
      const a = cur[cur.length - 1], g = s.abs - a.abs, ja = jenisScan(a.status), jb = jenisScan(s.status);
      let baru;
      if (g > SESI.maksJam * 60) baru = true;
      // Keluar sebentar hanya berlaku bila sesi berjalan belum mencapai durasi kerja
      // penuh. Bila sudah, Check In berikutnya adalah sesi baru, misalnya shift malam
      // yang selesai pagi lalu lanjut lembur pada hari libur.
      else if (ja === "out" && jb === "in")
        // Scan OT adalah kelanjutan shift yang sama, jadi tidak pernah memulai sesi baru.
        baru = !isOT(s.status) && (g >= SESI.istirahatMinJam * 60 || (a.abs - cur[0].abs) >= SESI.kerjaPenuhJam * 60);
      else if (ja === "in" && jb === "out") baru = false;
      else baru = g > SESI.statusSamaJam * 60;
      if (baru) { sesi.push(cur); cur = []; }
    }
    cur.push(s);
  });
  if (cur.length) sesi.push(cur);
  return sesi;
}

/** Dari scan normal (bukan OT) dalam satu sesi, tentukan scan masuk dan scan pulang. */
function tentukanMasukPulang(normal, info) {
  if (!normal.length) return { masuk: null, pulang: null };
  if (normal.length === 1) {
    return jenisScan(normal[0].status) === "out" ? { masuk: null, pulang: normal[0] } : { masuk: normal[0], pulang: null };
  }
  const p = normal[0], q = normal[normal.length - 1];
  const adaIn = normal.some((s) => jenisScan(s.status) === "in");
  const adaOut = normal.some((s) => jenisScan(s.status) === "out");
  if (q.abs - p.abs >= SESI.labelJam * 60) {
    if (jenisScan(p.status) === "out" || jenisScan(q.status) === "in") info.dikoreksi++;
    return { masuk: p, pulang: q };
  }
  if (adaIn && !adaOut) return { masuk: p, pulang: null };    // beberapa scan masuk berdekatan
  if (adaOut && !adaIn) return { masuk: null, pulang: q };    // beberapa scan pulang berdekatan
  return { masuk: p, pulang: q };
}

/** Tanggal kerja sebuah sesi. Shift malam dicatat pada tanggal ia mulai bekerja. */
function tanggalKerjaSesi(masuk, pulang, ot, kar) {
  if (masuk) return masuk.menit < SESI.awalHariMenit ? tambahHari(masuk.tanggal, -1) : masuk.tanggal;
  const ref = pulang || ot[0];
  if (kar && kar.shift === "3" && ref.menit < SESI.dini * 60) return tambahHari(ref.tanggal, -1);
  if (kar && kar.shift === "2" && ref.menit < SESI.diniShift2 * 60) return tambahHari(ref.tanggal, -1);
  return ref.tanggal;
}

/** Shift yang jadwal masuk (atau pulang) paling dekat dengan jam scan sebenarnya. */
function tebakKodeShift(menit, kodeAbsen, cadangan, bidang = "masuk") {
  const maks = (bidang === "masuk" ? SESI.jarakShiftMaksJam : SESI.jarakKeluarMaksJam) * 60;
  let terbaik = null, jarak = Infinity;
  kodeAbsen.forEach((k) => {
    const jam = bidang === "masuk" ? k.masuk : k.keluar;
    if (k.jenis !== "hadir" || !jam) return;
    let d = Math.abs(menit - jamKeMenit(jam)); d = Math.min(d, 1440 - d);
    if (d < jarak) { jarak = d; terbaik = k.kode; }
  });
  return terbaik && jarak <= maks ? terbaik : cadangan;
}

/** Jadwal masuk dan keluar (menit mutlak) untuk tanggal kerja tertentu; shift malam berakhir keesokan harinya. */
function jadwalMutlak(tanggal, mk) {
  if (!mk || !mk.masuk || !mk.keluar) return null;
  const m = jamKeMenit(mk.masuk), k = jamKeMenit(mk.keluar), dasar = hariMenit(tanggal);
  return { masuk: dasar + m, keluar: dasar + k + (k <= m ? 1440 : 0) };
}

/**
 * Menyusun draft absensi harian dari log mentah.
 * `info` diisi statistik proses (scan ganda, sesi terkoreksi, tepi berkas, dst.)
 * dan `info.lanjutan` berisi scan pulang di awal berkas untuk melengkapi hasil impor sebelumnya.
 */
function susunDraftAbsensi(log, ctx, info) {
  const { karyawan, kodeAbsen, pengaturan, hariLibur } = ctx;
  info = info || {};
  Object.assign(info, { ganda: 0, sesi: 0, dikoreksi: 0, shiftBeda: 0, awalTerpotong: 0, akhirTerpotong: 0, lanjutan: [] });
  const petaKar = new Map(karyawan.map(k => [k.nik, k]));
  const petaKode = new Map(kodeAbsen.map(k => [k.kode, k]));
  const setLibur = new Set(hariLibur.map(h => h.tanggal));

  const perPin = new Map();
  let tMin = Infinity, tMax = -Infinity;
  log.forEach((s) => {
    if (isIstirahat(s.status) || s.menit == null) return;
    const x = { ...s, abs: menitMutlak(s), ganda: 0 };
    tMin = Math.min(tMin, x.abs); tMax = Math.max(tMax, x.abs);
    if (!perPin.has(x.pin)) perPin.set(x.pin, []);
    perPin.get(x.pin).push(x);
  });

  const draft = new Map();
  perPin.forEach((scans, pin) => {
    scans.sort((a, b) => a.abs - b.abs);
    const kar = petaKar.get(pin);
    const daftarSesi = bentukSesi(scans, info);

    daftarSesi.forEach((punches, idx) => {
      info.sesi++;
      const normal = punches.filter(s => !isOT(s.status));
      const ot = punches.filter(s => isOT(s.status));
      const { masuk, pulang } = tentukanMasukPulang(normal, info);

      // Scan pulang tunggal di awal berkas: shift-nya dimulai sebelum berkas ini.
      // Tidak langsung masuk draft; dipakai melengkapi baris hasil impor sebelumnya,
      // dan baris cadangannya baru dibuat bila tidak ada baris yang cocok.
      const awalBerkas = !masuk && pulang && normal.length === 1 && !ot.length && pulang.abs - tMin <= SESI.tepiBerkasJam * 60;
      if (awalBerkas) info.awalTerpotong++;

      const tanggal = tanggalKerjaSesi(masuk, pulang, ot, kar);
      const otIn = ot.find(s => jenisScan(s.status) === "in") || null;
      let otMulai = otIn, otSelesai = [...ot].reverse().find(s => jenisScan(s.status) === "out") || null;
      // Pasangkan OT In dengan OT Out; abaikan bila hanya satu sisi atau keduanya scan ganda.
      if (otMulai && otSelesai && otMulai.abs >= otSelesai.abs) { otMulai = null; otSelesai = null; }

      const libur = setLibur.has(tanggal) || isMinggu(tanggal);
      const kodeMaster = kar ? kar.shift : "1";
      let kodeDasar = kodeMaster;
      if (!libur && pengaturan.deteksiShift !== false && (masuk || pulang)) {
        kodeDasar = masuk ? tebakKodeShift(masuk.menit, kodeAbsen, kodeMaster, "masuk")
                          : tebakKodeShift(pulang.menit, kodeAbsen, kodeMaster, "keluar");
        if (kar && kodeDasar !== kodeMaster) info.shiftBeda++;
      }
      if (libur) kodeDasar = "HW";
      const mk = petaKode.get(kodeDasar) || petaKode.get("1");
      const jadwal = jadwalMutlak(tanggal, mk);

      const d = {
        id: `${pin}-${tanggal}`, nik: pin,
        nama: kar ? kar.nama : (punches[0].nama || ""),
        dept: kar ? kar.dept : "", kelompok: kar ? kar.kelompok : "N",
        tanggal, kodeDasar,
        jamMasuk: masuk ? masuk.jam : "", jamPulang: pulang ? pulang.jam : "",
        jumlahScan: punches.reduce((n, s) => n + 1 + s.ganda, 0),
        otKlaimMasuk: otMulai ? otMulai.jam : "", otKlaimPulang: otSelesai ? otSelesai.jam : "",
        lemburMasuk: "", lemburPulang: "", lemburIstirahat: null,
        lemburFisik: 0, lemburKonversi: 0, hariLibur: libur,
        terlambatMenit: 0, statusVerifikasi: "otomatis", alasan: [], catatan: "",
        diverifikasiOleh: "", diverifikasiPada: "", riwayat: [],
        nikTidakDikenal: !kar,
        _n: normal.length + ot.length,
      };

      if (!kar) d.alasan.push("NIK tidak terdaftar pada data karyawan");
      if (masuk && !pulang) {
        if (idx === daftarSesi.length - 1 && tMax - masuk.abs <= SESI.tepiBerkasJam * 60) {
          if (kar) info.akhirTerpotong++;
          d.alasan.push("Berkas berakhir sebelum scan pulang, shift kemungkinan belum selesai");
        } else d.alasan.push("Jam pulang tidak tercatat");
      }
      if (!masuk && pulang) d.alasan.push("Jam masuk tidak tercatat");
      if (!masuk && !pulang) d.alasan.push("Hanya ada scan lembur tanpa scan masuk atau pulang");
      if (punches.length > 4) d.alasan.push(`Terdapat ${punches.length} kali scan pada sesi kerja ini`);
      if (masuk && pulang) {
        const dur = pulang.abs - masuk.abs;
        if (dur < SESI.durasiMinMenit) d.alasan.push(`Durasi kerja hanya ${dur} menit`);
        else if (dur > SESI.durasiMaksJam * 60) d.alasan.push(`Durasi kerja ${jamFmt(jamDesimal(dur))} jam, di luar kewajaran`);
      }

      if (jadwal && masuk) {
        const tl = masuk.abs - jadwal.masuk;
        if (tl > 0 && tl < 600) d.terlambatMenit = tl;
      }

      // Selisih pulang terhadap jadwal dihitung dengan waktu mutlak, bukan jam saja,
      // agar pulang lebih awal tidak terbaca sebagai lembur keesokan harinya.
      const lebihMenit = jadwal && pulang ? pulang.abs - jadwal.keluar : 0;
      const pakaiOT = pengaturan.sumberLembur === "ot-status";
      if (libur && masuk && pulang) {
        d.lemburMasuk = masuk.jam; d.lemburPulang = pulang.jam;
        d.alasan.push("Bekerja pada hari libur, seluruh jam dihitung sebagai lembur");
      } else if (pakaiOT && otMulai && otSelesai) {
        d.lemburMasuk = otMulai.jam; d.lemburPulang = otSelesai.jam;
        d.alasan.push("Terdapat klaim lembur (OT In/OT Out) dari mesin");
      } else if (pakaiOT && (otMulai || otSelesai)) {
        d.alasan.push("Klaim lembur tidak lengkap, hanya ada OT In atau OT Out saja");
      } else if (!pakaiOT && lebihMenit > pengaturan.toleransiMenit) {
        d.lemburMasuk = mk.keluar; d.lemburPulang = pulang.jam;
        d.alasan.push(`Pulang ${lebihMenit} menit melewati jadwal, di luar toleransi ${pengaturan.toleransiMenit} menit`);
      }
      if (!libur && pakaiOT && !otMulai && lebihMenit > pengaturan.toleransiMenit) {
        d.alasan.push(`Pulang ${lebihMenit} menit melewati jadwal, namun tidak ada klaim lembur`);
      }

      hitungLembur(d, pengaturan, kodeAbsen);

      if (awalBerkas) {
        delete d._n;
        d.statusVerifikasi = "perlu-verifikasi";
        info.lanjutan.push({ id: d.id, nik: pin, jamPulang: pulang.jam, tanggal: pulang.tanggal, abs: pulang.abs, cadangan: d });
        return;
      }

      // Dua sesi jatuh pada tanggal kerja yang sama: pertahankan yang lebih lengkap.
      const ada = draft.get(d.id);
      if (!ada) { draft.set(d.id, d); return; }
      const [utama, lain] = d._n > ada._n ? [d, ada] : [ada, d];
      const jamLain = [lain.jamMasuk, lain.jamPulang].filter(Boolean).map(j => j.slice(0, 5)).join(", ");
      utama.alasan.push(`Ada scan lain pada tanggal ini yang tidak terpasang (${jamLain})`);
      utama.jumlahScan += lain.jumlahScan;
      draft.set(d.id, utama);
    });
  });

  const hasil = [...draft.values()];
  hasil.forEach((d) => { d.statusVerifikasi = d.alasan.length ? "perlu-verifikasi" : "otomatis"; delete d._n; });
  hasil.sort((a, b) => a.tanggal.localeCompare(b.tanggal) || a.nik.localeCompare(b.nik));
  return hasil;
}

/** Rumus A: jam ke-1 x1,5 lalu x2. Rumus B (hari libur): jam 1-7 x2, jam 8 x3, jam 9+ x4. */
function konversiLembur(jam, rumus) {
  if (!jam || jam <= 0) return 0;
  let sisa = jam, total = 0, ke = 1;
  while (sisa > 0) {
    const porsi = Math.min(1, sisa);
    const p = rumus === "B" ? (ke <= 7 ? 2 : ke === 8 ? 3 : 4) : (ke === 1 ? 1.5 : 2);
    total += porsi * p; sisa -= porsi; ke++;
  }
  return Math.round(total * 100) / 100;
}
function bulatkan(jam, mode) {
  if (mode === "0") return Math.round(jam * 100) / 100;
  const step = mode === "0.5" ? 0.5 : 0.25;
  return Math.floor(jam / step) * step;
}
function hitungLembur(d, pengaturan, kodeAbsen) {
  const mk = kodeAbsen ? kodeAbsen.find(k => k.kode === d.kodeDasar) : null;
  const rumus = mk ? mk.rumus : (d.hariLibur ? "B" : "A");
  if (!d.lemburMasuk || !d.lemburPulang) { d.lemburFisik = 0; d.lemburKonversi = 0; return d; }
  const kotor = jamDesimal(selisihMenit(jamKeMenit(d.lemburMasuk), jamKeMenit(d.lemburPulang)));
  const istirahat = d.lemburIstirahat != null ? Number(d.lemburIstirahat)
    : d.hariLibur ? (kotor >= 6 ? pengaturan.istirahatLemburHW : 0)
    : (kotor >= pengaturan.istirahatLemburMinJam ? pengaturan.istirahatLemburJam : 0);
  d.istirahatTerpakai = istirahat;
  d.lemburFisik = Math.round(bulatkan(Math.max(0, kotor - istirahat), pengaturan.bulatkanLembur) * 100) / 100;
  d.lemburKonversi = konversiLembur(d.lemburFisik, rumus === "-" ? "A" : rumus);
  return d;
}

/**
 * Melengkapi baris yang jam pulangnya belum tercatat karena berkas
 * sebelumnya berakhir di tengah shift.
 */
function lengkapiPulang(a, jamPulang, ctx, pulangAbs) {
  if (!a || !a.jamMasuk || a.jamPulang) return false;
  if (a.statusVerifikasi === "disetujui" || a.statusVerifikasi === "ditolak") return false;
  const { kodeAbsen, pengaturan } = ctx;
  a.jamPulang = jamPulang;
  a.alasan = a.alasan.filter(x => !/berkas berakhir|jam pulang tidak tercatat/i.test(x));
  const mk = kodeAbsen.find(k => k.kode === a.kodeDasar);
  if (a.hariLibur) { a.lemburMasuk = a.jamMasuk; a.lemburPulang = jamPulang; }
  else if (pengaturan.sumberLembur !== "ot-status" && mk && mk.keluar) {
    const jd = jadwalMutlak(a.tanggal, mk);
    const lebih = pulangAbs != null && jd ? pulangAbs - jd.keluar : selisihMenit(jamKeMenit(mk.keluar), jamKeMenit(jamPulang));
    if (lebih > pengaturan.toleransiMenit) { a.lemburMasuk = mk.keluar; a.lemburPulang = jamPulang; }
  }
  hitungLembur(a, pengaturan, kodeAbsen);
  a.alasan.push("Jam pulang dilengkapi dari berkas berikutnya");
  a.statusVerifikasi = a.alasan.length ? "perlu-verifikasi" : "otomatis";
  return true;
}

/**
 * Mencari baris milik karyawan yang masih terbuka (ada jam masuk, belum ada jam pulang)
 * dan paling mungkin dilengkapi oleh scan pulang di awal berkas berikutnya.
 * Dicocokkan dari waktu scan, bukan dari dugaan shift, sehingga karyawan berotasi tetap benar.
 */
function cariBarisTerbuka(absensi, x) {
  let terbaik = null, waktu = -Infinity;
  absensi.forEach(a => {
    if (a.nik !== x.nik || !a.jamMasuk || a.jamPulang) return;
    const menitMasuk = jamKeMenit(a.jamMasuk);
    const m = hariMenit(a.tanggal) + menitMasuk + (menitMasuk < SESI.awalHariMenit ? 1440 : 0);
    const selisih = x.abs - m;
    if (selisih > 0 && selisih <= SESI.maksJam * 60 && m > waktu) { terbaik = a; waktu = m; }
  });
  return terbaik;
}

/** Rekap per karyawan, lengkap dengan rincian per kelompok untuk keperluan berkas export. */
function rekapPeriode(absensi, ctx, dari, sampai) {
  const { karyawan, kodeAbsen, pengaturan, kelompok } = ctx;
  const petaKode = new Map(kodeAbsen.map(k => [k.kode, k]));
  const hasil = new Map();
  karyawan.filter(k => k.aktif).forEach(k => {
    hasil.set(k.nik, {
      nik: k.nik, nama: k.nama, dept: k.dept, kelompok: k.kelompok,
      jabatan: k.jabatan, status: k.status, masuk: k.masuk,
      hariKerja: 0, hadir: 0, terlambat: 0, alpa: 0, ijin: 0, sakit: 0, cuti: 0, hw: 0,
      lemburFisikBiasa: 0, lemburKonversiBiasa: 0, lemburFisikLibur: 0, lemburKonversiLibur: 0,
      uangShift2: 0, uangShift3: 0, uangMakan: 0, uangTransport: 0,
      perKel: {}, absKode: {},
    });
  });
  const sel = (r, kel) => (r.perKel[kel] = r.perKel[kel] || {
    hariKerja:0, fisikBiasa:0, fisikLibur:0, konvBiasa:0, konvLibur:0, shift2:0, shift3:0, makan:0, transport:0 });

  absensi.forEach(d => {
    if (d.tanggal < dari || d.tanggal > sampai) return;
    const r = hasil.get(d.nik); if (!r) return;
    const mk = petaKode.get(d.kodeDasar);
    const kel = d.kelompok || "N";
    const pk = sel(r, kel);
    const kt = kodeTampil(kel, d.kodeDasar, kelompok);
    r.absKode[kt] = (r.absKode[kt] || 0) + 1;
    if (mk && mk.hitungHari) { r.hariKerja++; r.hadir++; pk.hariKerja++; }
    if (d.terlambatMenit > 0) r.terlambat++;
    if (mk) {
      if (mk.jenis === "alpa") r.alpa++;
      else if (mk.jenis === "ijin") r.ijin++;
      else if (mk.jenis === "sakit") r.sakit++;
      else if (mk.jenis === "cuti") r.cuti++;
      else if (mk.jenis === "hw") r.hw++;
      if (d.kodeDasar === "2") { r.uangShift2 += mk.uangShift; pk.shift2 += mk.uangShift; }
      if (d.kodeDasar === "3") { r.uangShift3 += mk.uangShift; pk.shift3 += mk.uangShift; }
    }
    if (d.statusVerifikasi !== "ditolak" && d.lemburFisik > 0) {
      if (d.hariLibur) {
        r.lemburFisikLibur += d.lemburFisik; r.lemburKonversiLibur += d.lemburKonversi;
        pk.fisikLibur += d.lemburFisik; pk.konvLibur += d.lemburKonversi;
      } else {
        r.lemburFisikBiasa += d.lemburFisik; r.lemburKonversiBiasa += d.lemburKonversi;
        pk.fisikBiasa += d.lemburFisik; pk.konvBiasa += d.lemburKonversi;
      }
      if (d.lemburFisik >= pengaturan.makanLemburMinJam) { r.uangMakan += pengaturan.uangMakanLembur; pk.makan += pengaturan.uangMakanLembur; }
      if (pengaturan.transportLemburKode.includes(d.kodeDasar)) { r.uangTransport += pengaturan.uangTransportLembur; pk.transport += pengaturan.uangTransportLembur; }
    }
  });
  const bulat = (n) => Math.round(n * 100) / 100;
  return [...hasil.values()].map(r => ({
    ...r,
    lemburFisikBiasa: bulat(r.lemburFisikBiasa), lemburKonversiBiasa: bulat(r.lemburKonversiBiasa),
    lemburFisikLibur: bulat(r.lemburFisikLibur), lemburKonversiLibur: bulat(r.lemburKonversiLibur),
  }));
}

/* Pembuat log contoh yang meniru keluaran mesin Solution X100-C. */
function buatLogContoh(karyawan, dari, sampai, hariLibur) {
  const rows = [];
  const setLibur = new Set(hariLibur.map(h => h.tanggal));
  const jadwal = { "1":[450,960], "2":[945,1425], "3":[1410,1905] };
  const tambah = (nik, tgl, menit, st) => {
    const lewat = Math.floor(menit / 1440), m = ((menit % 1440) + 1440) % 1440;
    let t = tgl;
    if (lewat > 0) { const x = fromISO(tgl); x.setDate(x.getDate() + lewat); t = toISO(x); }
    const jam = `${pad2(Math.floor(m/60))}:${pad2(m%60)}:${pad2(Math.floor(acakStabil(nik+tgl+st+m)*59))}`;
    rows.push(`${nik}\t${t} ${jam}\t1\t${st}\t1\t0`);
  };
  const d0 = fromISO(dari), d1 = fromISO(sampai);
  for (let d = new Date(d0); d <= d1; d.setDate(d.getDate()+1)) {
    const tgl = toISO(d);
    const libur = setLibur.has(tgl) || d.getDay() === 0;
    karyawan.forEach(k => {
      if (!k.aktif) return;
      const r = acakStabil(k.nik + tgl);
      // Pada hari libur, karyawan shift malam baru pulang pagi sehingga tidak ikut lembur.
      if (libur) { if (k.shift === "3" || r > 0.14) return; } else if (r > 0.96) return;
      if (libur) {
        const mulai = 450 + Math.floor(acakStabil(k.nik+tgl+"i")*30);
        tambah(k.nik, tgl, mulai, 0);
        tambah(k.nik, tgl, mulai + 300 + Math.floor(acakStabil(k.nik+tgl+"d")*330), 1);
        return;
      }
      const [jm, jk] = jadwal[k.shift] || jadwal["1"];
      const masuk = jm - 25 + Math.floor(acakStabil(k.nik+tgl+"in")*35);
      tambah(k.nik, tgl, masuk, 0);
      if (acakStabil(k.nik+tgl+"g") > 0.97) tambah(k.nik, tgl, masuk + 2, 0);
      if (acakStabil(k.nik+tgl+"m") > 0.975) return;
      const keluar = jk + Math.floor(acakStabil(k.nik+tgl+"out")*22);
      tambah(k.nik, tgl, keluar, 1);
      if (acakStabil(k.nik+tgl+"ot") > 0.87) {
        const batas = k.shift === "3" ? 180 : 255;
        const dur = 60 + Math.floor(acakStabil(k.nik+tgl+"dur")*batas);
        tambah(k.nik, tgl, keluar + 5, 4);
        tambah(k.nik, tgl, keluar + 5 + dur, 5);
      }
    });
    if (acakStabil(tgl+"x") > 0.55) { tambah("520036", tgl, 333, 0); tambah("520036", tgl, 905, 1); }
  }
  rows.sort((a,b) => a.split("\t")[1].localeCompare(b.split("\t")[1]));
  return rows.join("\r\n") + "\r\n";
}

/* Nomor gaya sel: 0 biasa | 1 judul | 2 kepala | 3 total | 4 angka | 5 total angka | 6 rata tengah */
const G = { biasa:0, judul:1, kepala:2, total:3, angka:4, totalAngka:5, tengah:6 };
const sel = (v, gaya) => ({ v: v === 0 ? "" : v, gaya });
const selAngka = (v, gaya) => ({ v: v ? Math.round(v * 100) / 100 : "", gaya });

/** Berkas Rekap: satu baris per karyawan, kolom dipecah per kelompok. */
function berkasRekap(rekap, ctx, dari, sampai, namaDept) {
  const kel = ctx.kelompok, kodeAbsen = ctx.kodeAbsen;
  const h1 = ["No.","NIK","Nama","Departemen","Divisi/Job Title","Tanggal Masuk","Total Hari Kerja"];
  const h2 = ["","","","","","","All"];
  const h3 = ["","","","","","",""];
  kel.forEach(k => { h1.push(""); h2.push(k.nama); h3.push(""); });
  kel.forEach(k => {
    h1.push(`Lembur Fisik ${k.nama}`,"",`Lembur Konversi ${k.nama}`,"");
    h2.push("Hari Biasa","Hari Libur","Hari Biasa","Hari Libur");
    h3.push("","","","");
  });
  ["Uang Shift 2","Uang Shift 3","Uang Makan","Uang Transport"].forEach(j =>
    kel.forEach((k,i) => { h1.push(i===0?j:""); h2.push(k.nama); h3.push(""); }));
  kodeAbsen.forEach((ka,i) => kel.forEach((k,j) => {
    h1.push(i===0 && j===0 ? "Absensi" : ""); h2.push("");
    h3.push(kodeTampil(k.kode, ka.kode, kel));
  }));

  const nol = { hariKerja:0,fisikBiasa:0,fisikLibur:0,konvBiasa:0,konvLibur:0,shift2:0,shift3:0,makan:0,transport:0 };
  const tot = { hariKerja:0, perKel:{}, absKode:{} };
  kel.forEach(k => { tot.perKel[k.kode] = { ...nol }; });

  const baris = rekap.map((r,i) => {
    const b = [sel(i+1,G.tengah), sel(r.nik,G.biasa), sel(r.nama,G.biasa),
      sel(namaDept(r.dept),G.biasa), sel(r.jabatan,G.biasa), sel(r.masuk||"",G.tengah), sel(r.hariKerja,G.tengah)];
    tot.hariKerja += r.hariKerja;
    kel.forEach(k => { const pk = r.perKel[k.kode] || nol; b.push(sel(pk.hariKerja,G.tengah)); tot.perKel[k.kode].hariKerja += pk.hariKerja; });
    kel.forEach(k => {
      const pk = r.perKel[k.kode] || nol, t = tot.perKel[k.kode];
      b.push(selAngka(pk.fisikBiasa,G.angka), selAngka(pk.fisikLibur,G.angka), selAngka(pk.konvBiasa,G.angka), selAngka(pk.konvLibur,G.angka));
      t.fisikBiasa+=pk.fisikBiasa; t.fisikLibur+=pk.fisikLibur; t.konvBiasa+=pk.konvBiasa; t.konvLibur+=pk.konvLibur;
    });
    ["shift2","shift3","makan","transport"].forEach(f => kel.forEach(k => {
      const pk = r.perKel[k.kode] || nol; b.push(sel(pk[f],G.biasa)); tot.perKel[k.kode][f] += pk[f];
    }));
    kodeAbsen.forEach(ka => kel.forEach(k => {
      const kt = kodeTampil(k.kode, ka.kode, kel), v = r.absKode[kt] || 0;
      b.push(sel(v,G.tengah));
      if (v) tot.absKode[kt] = (tot.absKode[kt] || 0) + v;
    }));
    return b;
  });

  const bt = [sel("TOTAL",G.total), sel("",G.total), sel("",G.total), sel("",G.total), sel("",G.total), sel("",G.total), sel(tot.hariKerja,G.total)];
  kel.forEach(k => bt.push(sel(tot.perKel[k.kode].hariKerja,G.total)));
  kel.forEach(k => { const t = tot.perKel[k.kode];
    bt.push(selAngka(t.fisikBiasa,G.totalAngka), selAngka(t.fisikLibur,G.totalAngka), selAngka(t.konvBiasa,G.totalAngka), selAngka(t.konvLibur,G.totalAngka)); });
  ["shift2","shift3","makan","transport"].forEach(f => kel.forEach(k => bt.push(sel(tot.perKel[k.kode][f],G.total))));
  kodeAbsen.forEach(ka => kel.forEach(k => bt.push(sel(tot.absKode[kodeTampil(k.kode,ka.kode,kel)]||0, G.total))));

  const lebar = [5,10,24,16,22,12,9].concat(Array(kel.length).fill(9))
    .concat(Array(kel.length*4).fill(9)).concat(Array(kel.length*4).fill(11))
    .concat(Array(kodeAbsen.length*kel.length).fill(5));

  return {
    nama: "Rekap", beku: 6, lebar,
    baris: [
      [sel("REKAP ABSENSI DAN LEMBUR", G.judul)],
      [sel(`PERIODE ${tglStrip(dari)} SD ${tglStrip(sampai)}`, G.judul)],
      [],
      h1.map(x => sel(x, G.kepala)),
      h2.map(x => sel(x, G.kepala)),
      h3.map(x => sel(x, G.kepala)),
      ...baris, bt,
    ],
  };
}

/** Berkas Rincian: satu blok per karyawan, satu baris per tanggal. */
function berkasRincian(rekap, absensi, ctx, dari, sampai) {
  const { kodeAbsen, kelompok, pengaturan } = ctx;
  const petaKode = new Map(kodeAbsen.map(k => [k.kode, k]));
  const kolom = ["Tanggal","Abs","Deskripsi","Jam Masuk Standar","Jam Keluar Standar","Jam Istirahat Standar",
    "Jam Masuk Slot","Jam Keluar Slot","Jam Masuk Lembur","Jam Keluar Lembur","Jam Istirahat Lembur",
    "Jam Lembur Fisik","Lembur Fisik Hari Biasa","Lembur Fisik Hari Libur","Jam Lembur Konversi",
    "Lembur Konversi Hari Biasa","Lembur Konversi Hari Libur","Uang Shift 2","Uang Shift 3",
    "Uang Makan","Uang Transport","Uang Insentif"];
  const tgl = daftarTanggal(dari, sampai);
  const petaAbs = new Map(absensi.map(a => [a.nik + "|" + a.tanggal, a]));
  const semua = [];

  rekap.forEach((r, idx) => {
    if (idx) { semua.push([]); semua.push([]); }
    semua.push([sel("RINCIAN ABSENSI DAN LEMBUR", G.judul)]);
    semua.push([sel(`NAMA : ${String(r.nama).toUpperCase()} (${r.nik})`, G.judul)]);
    semua.push([sel(`DIVISI/JOB TITLE : ${r.jabatan}`, G.judul)]);
    semua.push([sel(`PERIODE : ${tglStrip(dari)} SD ${tglStrip(sampai)}`, G.judul)]);
    semua.push(kolom.map(x => sel(x, G.kepala)));

    const t = { hari:0,fisik:0,fb:0,fl:0,konv:0,kb:0,kl:0,s2:0,s3:0,mk:0,tr:0 };
    tgl.forEach(tg => {
      const a = petaAbs.get(r.nik + "|" + tg);
      if (!a) { semua.push([sel(tglStrip(tg), G.tengah), ...Array(kolom.length-1).fill(sel("", G.biasa))]); return; }
      const mk = petaKode.get(a.kodeDasar);
      const sah = a.statusVerifikasi !== "ditolak";
      const fisik = sah ? a.lemburFisik : 0, konv = sah ? a.lemburKonversi : 0;
      const fb = a.hariLibur ? 0 : fisik, fl = a.hariLibur ? fisik : 0;
      const kb = a.hariLibur ? 0 : konv, kl = a.hariLibur ? konv : 0;
      const s2 = a.kodeDasar === "2" && mk ? mk.uangShift : 0;
      const s3 = a.kodeDasar === "3" && mk ? mk.uangShift : 0;
      const mkn = fisik >= pengaturan.makanLemburMinJam ? pengaturan.uangMakanLembur : 0;
      const tr = fisik > 0 && pengaturan.transportLemburKode.includes(a.kodeDasar) ? pengaturan.uangTransportLembur : 0;
      if (mk && mk.hitungHari) t.hari++;
      t.fisik+=fisik; t.fb+=fb; t.fl+=fl; t.konv+=konv; t.kb+=kb; t.kl+=kl; t.s2+=s2; t.s3+=s3; t.mk+=mkn; t.tr+=tr;
      semua.push([
        sel(tglStrip(tg), G.tengah),
        sel(kodeTampil(a.kelompok, a.kodeDasar, kelompok), G.tengah),
        sel(labelKode(a.kelompok, a.kodeDasar, kelompok, kodeAbsen), G.biasa),
        sel(jamTitik(mk && mk.masuk), G.tengah), sel(jamTitik(mk && mk.keluar), G.tengah),
        selAngka(mk && mk.istirahat, G.tengah),
        sel(a.jamMasuk || "", G.tengah), sel(a.jamPulang || "", G.tengah),
        sel(jamTitik(a.lemburMasuk), G.tengah), sel(jamTitik(a.lemburPulang), G.tengah),
        selAngka(a.istirahatTerpakai, G.tengah),
        selAngka(fisik, G.angka), selAngka(fb, G.angka), selAngka(fl, G.angka),
        selAngka(konv, G.angka), selAngka(kb, G.angka), selAngka(kl, G.angka),
        sel(s2, G.biasa), sel(s3, G.biasa), sel(mkn, G.biasa), sel(tr, G.biasa), sel("", G.biasa),
      ]);
    });
    semua.push([sel("",G.total),sel("",G.total),sel("",G.total),sel("",G.total),sel("",G.total),
      sel("",G.total),sel("",G.total),sel("",G.total),sel("",G.total),sel("",G.total),
      sel(t.hari, G.total),
      selAngka(t.fisik,G.totalAngka), selAngka(t.fb,G.totalAngka), selAngka(t.fl,G.totalAngka),
      selAngka(t.konv,G.totalAngka), selAngka(t.kb,G.totalAngka), selAngka(t.kl,G.totalAngka),
      sel(t.s2,G.total), sel(t.s3,G.total), sel(t.mk,G.total), sel(t.tr,G.total), sel(0,G.total)]);
  });

  return { nama: "Rincian", lebar: [11,7,26,11,11,11,11,11,11,11,11,11,12,12,12,12,12,11,11,11,11,11], baris: semua };
}

/** Berkas absensi harian untuk satu tanggal. */
function berkasHarian(list, ctx, tanggal, namaDept, namaKelompok, namaKode) {
  const kolom = ["NIK","Nama","Departemen","Kelompok","Abs","Deskripsi","Jam Masuk","Jam Pulang",

const KUNCI = "attendo.v3";
const KUNCI_TEMA = "attendo.tema";

function dataAwal() {
  return {
    versi: APP.versi,
    karyawan: KARYAWAN_SEED.map(k => ({ ...k })),
    departemen: DEPARTEMEN_SEED.map(d => ({ ...d })),
    kelompok: KELOMPOK_SEED.map(k => ({ ...k })),
    kodeAbsen: KODE_ABSEN_SEED.map(k => ({ ...k })),
    statusKaryawan: [...STATUS_KARYAWAN_SEED],
    hariLibur: HARI_LIBUR_SEED.map(h => ({ ...h })),
    pengaturan: { ...PENGATURAN_SEED, transportLemburKode: [...PENGATURAN_SEED.transportLemburKode] },
    absensi: [], periode: [], riwayatImport: [], aktivitas: [], backupTerakhir: "",
  };
}
const state = {
  masuk: false, pengguna: null,
  halaman: "dashboard", setTab: "lembur",
  sidebarHp: false, tema: "terang",
  data: dataAwal(), ui: {}, toast: [], modal: null,
};
function muatData() {
  try {
    const t = localStorage.getItem(KUNCI);
    if (t) { const j = JSON.parse(t); state.data = { ...dataAwal(), ...j, pengaturan: { ...PENGATURAN_SEED, ...(j.pengaturan||{}) } }; }
  } catch (e) { /* data rusak, pakai data awal */ }
  try {
    const tm = localStorage.getItem(KUNCI_TEMA);
    if (tm) state.tema = tm;
    else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) state.tema = "gelap";
  } catch (e) { /* abaikan */ }
  terapkanTema();
}

let timer = null;
function simpanData() {
  clearTimeout(timer);
  timer = setTimeout(() => {
    try { localStorage.setItem(KUNCI, JSON.stringify(state.data)); }
    catch (e) { console.warn("Gagal menyimpan:", e); }
  }, 120);
}
function terapkanTema() {
  document.documentElement.classList.toggle("dark", state.tema === "gelap");
  try { localStorage.setItem(KUNCI_TEMA, state.tema); } catch (e) { /* abaikan */ }
}
function gantiTema() { state.tema = state.tema === "gelap" ? "terang" : "gelap"; terapkanTema(); }
function resetSemua() { state.data = dataAwal(); simpanData(); }
function catatAktivitas(ikon, judul, detail) {
  state.data.aktivitas.unshift({ ikon, judul, detail,
    oleh: state.pengguna ? state.pengguna.nama : "Sistem", pada: new Date().toISOString() });
  state.data.aktivitas = state.data.aktivitas.slice(0, 60);
  simpanData();
}

let idToast = 0;
function toast(pesan, jenis = "info") {
  const id = ++idToast;
  state.toast.push({ id, pesan, jenis });
  setTimeout(() => { state.toast = state.toast.filter(t => t.id !== id); if (window.render) window.render(); }, 3200);

function grafik(data, lebar = 680, tinggi = 190) {
  if (!data.length) return "";
  const kiri=34, kanan=10, atas=12, bawah=26;
  const dw=lebar-kiri-kanan, dh=tinggi-atas-bawah;
  const maks=Math.max(...data.map(x=>x.n),5)*1.18;
  const dx=dw/Math.max(1,data.length-1);
  const t=data.map((x,i)=>[kiri+i*dx, atas+dh-(x.n/maks)*dh]);
  const garis=t.map((p,i)=>`${i?"L":"M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const area=`${garis} L${t[t.length-1][0].toFixed(1)},${atas+dh} L${t[0][0].toFixed(1)},${atas+dh} Z`;
  return `<svg viewBox="0 0 ${lebar} ${tinggi}" width="${lebar}" height="${tinggi}" preserveAspectRatio="xMidYMid meet"
    style="display:block;width:100%;height:100%;max-width:100%" role="img" aria-label="Grafik tren kehadiran">
    <defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" class="grad-atas"/><stop offset="100%" class="grad-bawah"/></linearGradient></defs>
    ${[0,0.5,1].map(f=>`<line x1="${kiri}" y1="${atas+dh*f}" x2="${lebar-kanan}" y2="${atas+dh*f}" class="grid-line"/>`).join("")}
    ${[1,0.5,0].map(f=>`<text x="${kiri-7}" y="${atas+dh*(1-f)+4}" text-anchor="end" class="axis-teks">${Math.round(maks*f)}</text>`).join("")}
    <path d="${area}" fill="url(#gA)"/><path d="${garis}" class="tren-garis"/>
    ${t.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" class="dot"><title>${esc(data[i].judul)}</title></circle>`).join("")}
    ${data.map((x,i)=>(i%Math.ceil(data.length/7)===0||i===data.length-1)
      ?`<text x="${t[i][0].toFixed(1)}" y="${tinggi-6}" text-anchor="middle" class="axis-teks">${esc(x.label)}</text>`:"").join("")}
  </svg>`;
}

const LANGKAH = ["Pilih Berkas","Periksa Data","Selesai"];
function indikator(aktif) {
  return `<div class="langkah-bar">${LANGKAH.map((l,i)=>{
    const n=i+1, st = aktif>n?"selesai":aktif===n?"aktif":"nanti";
    return `<div class="langkah ${st}"><span class="langkah-no">${aktif>n?ikon("ceklis",13):n}</span>
      <span class="langkah-teks">${esc(l)}</span></div>${i<LANGKAH.length-1?`<div class="langkah-garis ${aktif>n?"selesai":""}"></div>`:""}`;
  }).join("")}</div>`;
}
function catatanBaca(m, i) {
  const b = [];
  if (m.format === "attlog") b.push(`Berkas dikenali sebagai attlog mesin: ${m.jumlah} scan dari ${m.jumlahPin} nomor PIN.`);
  else if (m.format === "csv") b.push(`Berkas dikenali sebagai CSV berkepala: ${m.jumlah} scan dari ${m.jumlahPin} nomor PIN.`);
  if (m.dilewati) b.push(`${m.dilewati} baris dilewati karena susunannya tidak dikenali.`);
  if (i.ganda) b.push(`${i.ganda} scan ganda (status sama, berselang singkat) digabung menjadi satu.`);
  if (i.dikoreksi) b.push(`${i.dikoreksi} sesi diperbaiki karena tombol masuk/pulang pada mesin tertukar.`);
  if (i.shiftBeda) b.push(`${i.shiftBeda} baris memakai kode shift hasil deteksi jam scan, berbeda dari shift tetap karyawan.`);
  if (i.akhirTerpotong && m.akhir) b.push(`${i.akhirTerpotong} baris belum punya scan pulang karena berkas berakhir ${tglPendek(m.akhir.slice(0,10))} pukul ${m.akhir.slice(11,16)}. Jam pulangnya akan dilengkapi otomatis saat berkas periode berikutnya diimpor.`);
  if (i.awalTerpotong) b.push(`${i.awalTerpotong} scan pulang di awal berkas milik shift sebelum berkas ini, dipakai untuk melengkapi hasil impor sebelumnya. Bila tidak ada baris yang cocok, dibuatkan baris untuk diperiksa.`);
  return b;
}

/* ---------------- Rekap & Export ---------------- */
function dataRekap() {
  const u = state.ui.rek;
  let r = rekapPeriode(d().absensi, konteks(), u.dari, u.sampai)
    .filter(x=>x.hariKerja>0||x.lemburFisikBiasa>0||x.lemburFisikLibur>0||x.alpa>0||x.ijin>0||x.sakit>0||x.cuti>0||x.hw>0);
  if(u.kel!=="semua") r=r.filter(x=>x.kelompok===u.kel);
  const q=(u.cari||"").trim().toLowerCase();
  if(q) r=r.filter(x=>x.nama.toLowerCase().includes(q)||x.nik.includes(q));
  const urut={ nama:(a,b)=>a.nama.localeCompare(b.nama),
    lembur:(a,b)=>(b.lemburFisikBiasa+b.lemburFisikLibur)-(a.lemburFisikBiasa+a.lemburFisikLibur),
    hadir:(a,b)=>b.hariKerja-a.hariKerja, telat:(a,b)=>b.terlambat-a.terlambat };
  return r.sort(urut[u.urut]||urut.nama);
}

  const u = state.ui.rek || (state.ui.rek = { dari:p.dari, sampai:p.sampai, kel:"semua", cari:"", hal:1, urut:"nama" });
  if(!d().absensi.length) return `<div class="kartu">${kosong("dokumen","Belum ada data untuk direkap","Lakukan import absensi terlebih dahulu.",
    tombol("Buka Import Absensi",{jenis:"utama",ikon:"unggah",aksi:"pindah",data:{hal:"import"}}))}</div>`;
  const rekap = dataRekap();
  const perHal=14, total=Math.max(1,Math.ceil(rekap.length/perHal));
  const hal=Math.min(u.hal||1,total), baris=potongHal(rekap,hal,perHal);
  const t = rekap.reduce((s,r)=>({ hari:s.hari+r.hariKerja, fb:s.fb+r.lemburFisikBiasa, kb:s.kb+r.lemburKonversiBiasa,

    {hari:0,fb:0,kb:0,fl:0,kl:0,s2:0,s3:0,mk:0,tr:0});
  const st = statusPeriode(u.sampai);
  return `

    ${kartuKPI({ikon:"kalender",label:"Total Hari Kerja",nilai:t.hari,ket:"Seluruh karyawan",nada:"biru"})}
    ${kartuKPI({ikon:"jam",label:"Lembur Fisik",nilai:`${jamFmt(t.fb+t.fl)} j`,ket:`Biasa ${jamFmt(t.fb)} &middot; Libur ${jamFmt(t.fl)}`,nada:"ungu"})}
    ${kartuKPI({ikon:"arsip",label:"Total Tunjangan",nilai:`Rp ${rupiah(t.s2+t.s3+t.mk+t.tr)}`,ket:"Kelayakan, nominal final di payroll",nada:"hijau"})}
  </div>
  <div class="kartu">
    <div class="kartu-kepala flex-wrap gap-3">
      <div class="flex flex-wrap items-end gap-2">
        <label class="blok w-auto"><span class="label">Dari tanggal</span>
          <input type="date" value="${u.dari}" data-aksi="rek-dari" class="inp"></label>
        <label class="blok w-auto"><span class="label">Sampai tanggal</span>
          <input type="date" value="${u.sampai}" data-aksi="rek-sampai" class="inp"></label>
        <label class="blok w-auto"><span class="label">Kelompok</span>
          ${pilih("kel",u.kel,[{v:"semua",l:"Semua kelompok"},...d().kelompok.map(x=>({v:x.kode,l:x.nama}))],{aksi:"rek-kel"})}</label>
        <label class="blok w-auto"><span class="label">Urutkan</span>
          ${pilih("urut",u.urut,[{v:"nama",l:"Nama"},{v:"lembur",l:"Lembur terbanyak"},{v:"hadir",l:"Hari kerja"},{v:"telat",l:"Keterlambatan"}],{aksi:"rek-urut"})}</label>
      </div>
      <div class="flex items-end gap-2 flex-wrap">
        <div class="cari-bungkus">${ikon("cari",15,"ikon-kiri")}
          <input class="inp" placeholder="Cari nama atau NIK" value="${esc(u.cari||"")}" data-aksi="rek-cari"></div>
        ${tombol("Cetak",{ikon:"dokumen",aksi:"rek-cetak"})}
        ${tombol("Export Rincian",{ikon:"daftar",aksi:"rek-export-rincian",judul:"Berkas Excel rincian harian per karyawan"})}
        ${tombol("Export Rekap",{jenis:"utama",ikon:"excel",aksi:"rek-export",judul:"Berkas Excel rekap sesuai format yang berlaku"})}
      </div>
    </div>
    ${st!=="terbuka"?`<div class="pita-info">${ikon(st==="final"?"gembok":"info",14)} Periode ini berstatus ${st==="final"?"terkunci final":"closing"}.</div>`:""}
    ${baris.length?`<div class="tabel-bungkus"><table class="tabel">
      <thead>
        <tr><th rowspan="2">Karyawan</th><th rowspan="2">Departemen</th><th rowspan="2" class="tg">Hari</th>
          <th colspan="2" class="tg batas-kiri">Lembur Hari Biasa</th>
          <th colspan="2" class="tg batas-kiri">Lembur Hari Libur</th>
          <th colspan="4" class="tg batas-kiri">Tunjangan (Rp)</th></tr>
        <tr><th class="ka batas-kiri">Fisik</th><th class="ka">Konversi</th>
          <th class="ka batas-kiri">Fisik</th><th class="ka">Konversi</th>
          <th class="ka batas-kiri">Shift 2</th><th class="ka">Shift 3</th><th class="ka">Makan</th><th class="ka">Transport</th></tr>
      </thead>
      <tbody>${baris.map(r=>`<tr>
        <td><div class="sel-orang"><span class="txt font-medium">${esc(r.nama)}</span>
          <span class="txt3 text-[11px] font-mono">${esc(r.nik)} &middot; ${esc(namaKelompok(r.kelompok))}</span></div></td>
        <td class="txt2">${esc(namaDept(r.dept))}</td>
        <td class="tg tabular-nums txt">${r.hariKerja}</td>
        <td class="ka tabular-nums batas-kiri ${r.lemburFisikBiasa?"txt":"txt3"}">${r.lemburFisikBiasa?jamFmt(r.lemburFisikBiasa)+" j":"-"}</td>
        <td class="ka tabular-nums ${r.lemburKonversiBiasa?"txt-ungu font-medium":"txt3"}">${r.lemburKonversiBiasa?jamFmt(r.lemburKonversiBiasa)+" j":"-"}</td>
        <td class="ka tabular-nums batas-kiri ${r.lemburFisikLibur?"txt":"txt3"}">${r.lemburFisikLibur?jamFmt(r.lemburFisikLibur)+" j":"-"}</td>
        <td class="ka tabular-nums ${r.lemburKonversiLibur?"txt-ungu font-medium":"txt3"}">${r.lemburKonversiLibur?jamFmt(r.lemburKonversiLibur)+" j":"-"}</td>
        <td class="ka tabular-nums batas-kiri ${r.uangShift2?"txt2":"txt3"}">${r.uangShift2?rupiah(r.uangShift2):"-"}</td>

      </tr>`).join("")}</tbody>
      <tfoot><tr>
        <td colspan="2" class="txt font-semibold">TOTAL (${rekap.length} karyawan)</td>

      </tr></tfoot></table></div>
      ${halamanNav({hal,total,jumlah:`Menampilkan ${baris.length} dari ${rekap.length} karyawan`,aksiPrev:"rek-hal-prev",aksiNext:"rek-hal-next"})}`

  </div>
  <p class="txt3 text-[11.5px] mt-3 leading-relaxed">

    kolom lembur dan tunjangan dipecah per kelompok, disertai hitungan tiap kode absensi.
    <b class="txt2">Export Rincian</b> menghasilkan satu blok per karyawan berisi rincian harian.
  </p>`;
}

/* ---------------- Periode & Closing ---------------- */
function halamanPeriode() {
  const p = periodeBerjalan();
  const u = state.ui.per || (state.ui.per = { dari:p.dari, sampai:p.sampai });
  const daftar = [...d().periode].sort((a,b)=>b.dari.localeCompare(a.dari));
  const dlm = d().absensi.filter(a=>a.tanggal>=u.dari&&a.tanggal<=u.sampai);
  const belum = dlm.filter(a=>a.statusVerifikasi==="perlu-verifikasi");
  const st = statusPeriode(u.sampai);
  const pg = pengaturan();
  return `
  <div class="kotak-info mb-4">${ikon("info",16,"shrink-0 mt-0.5")}
    <div><p class="txt text-[12.5px] font-medium">Alur closing dua tahap</p>
    <p class="txt3 text-[12px] mt-1 leading-relaxed">
      <b class="txt2">Tahap 1, Closing</b> (sekitar tanggal ${pg.tanggalSlipGaji}): data periode dinyatakan selesai diperiksa dan slip gaji dibagikan. Perubahan masih diizinkan untuk menanggapi komplain karyawan.
      <b class="txt2">Tahap 2, Kunci Final</b> (sekitar tanggal ${pg.tanggalKunciFinal}, sebelum penggajian tanggal ${pg.tanggalPenggajian}): data dikunci permanen.
    </p></div></div>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-3">
    <div class="kartu p-5 lg:col-span-2">
      <div class="flex items-center justify-between gap-3">
        <p class="txt text-[14px] font-semibold">Periode Kerja</p>${lencanaPeriode(st)}
      </div>
      <div class="grid grid-cols-2 gap-3 mt-4 max-w-md">
        <label class="blok"><span class="label">Dari tanggal</span>
          <input type="date" value="${u.dari}" data-aksi="per-dari" class="inp"></label>
        <label class="blok"><span class="label">Sampai tanggal</span>
          <input type="date" value="${u.sampai}" data-aksi="per-sampai" class="inp"></label>
      </div>
      <div class="ringkas-periode">
        <div><p class="info-label">Baris absensi</p><p class="info-nilai">${dlm.length}</p></div>
        <div><p class="info-label">Belum diverifikasi</p><p class="info-nilai ${belum.length?"txt-kuning":""}">${belum.length}</p></div>
        <div><p class="info-label">Status</p><p class="info-nilai">${st==="final"?"Terkunci final":st==="closing"?"Closing":"Terbuka"}</p></div>
      </div>
      ${belum.length?`<div class="kotak-peringatan mt-4">${ikon("peringatan",16,"shrink-0 mt-0.5")}
        <div><p class="txt text-[12.5px] font-medium">Masih ada ${belum.length} baris yang belum diverifikasi</p>
        <p class="txt3 text-[12px] mt-1">Sebaiknya selesaikan verifikasi lembur sebelum menandai periode ini closing.</p></div></div>`:""}
      <div class="flex flex-wrap gap-2 mt-5">
        ${st==="terbuka"?tombol("Tandai Closing",{jenis:"utama",ikon:"ceklis",aksi:"per-closing",nonaktif:!dlm.length}):""}
        ${st==="closing"?tombol("Kunci Final",{jenis:"bahaya",ikon:"gembok",aksi:"per-final"}):""}
        ${st==="final"?tombol("Buka Kembali",{ikon:"gembokBuka",aksi:"per-buka"}):""}
        ${belum.length?tombol("Verifikasi Dulu",{ikon:"periksa",aksi:"pindah",data:{hal:"verifikasi"}}):""}
      </div>
    </div>
    <div class="kartu">
      <div class="kartu-kepala"><p class="txt text-[14px] font-semibold">Riwayat Periode</p></div>
      ${daftar.length?`<div class="p-4 space-y-3">
        ${daftar.map((c,i)=>`<div class="periode-baris">
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2 flex-wrap">
              <p class="txt text-[12.5px] font-medium">${tglPendek(c.dari)} sampai ${tglPendek(c.sampai)}</p>
              ${lencanaPeriode(c.status)}</div>
            <p class="txt3 text-[11.5px] mt-0.5">${esc(c.oleh)} &middot; ${new Date(c.pada).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"})}</p>
            <p class="txt3 text-[11px] mt-0.5">${c.jumlah} baris tercatat</p>
          </div>
          ${tombolIkon("hapus","Batalkan penandaan",{aksi:"per-batal",data:{i},nada:"merah"})}
        </div>`).join("")}</div>`
        :kosong("gembok","Belum ada periode ditandai","Periode yang sudah selesai diperiksa akan tercatat di sini.")}
    </div>
  </div>`;
}

/* ---------------- Karyawan ---------------- */
function halamanKaryawan() {
  const u = state.ui.kar || (state.ui.kar = { cari:"", dept:"semua", kel:"semua", aktif:"aktif", hal:1 });
  let list = d().karyawan;
  if(u.aktif==="aktif") list=list.filter(k=>k.aktif);
  else if(u.aktif==="nonaktif") list=list.filter(k=>!k.aktif);
  if(u.dept!=="semua") list=list.filter(k=>k.dept===u.dept);
  if(u.kel!=="semua") list=list.filter(k=>k.kelompok===u.kel);
  const q=(u.cari||"").trim().toLowerCase();
  if(q) list=list.filter(k=>k.nama.toLowerCase().includes(q)||k.nik.includes(q));
  list=[...list].sort((a,b)=>a.nama.localeCompare(b.nama));
  const perHal=12, total=Math.max(1,Math.ceil(list.length/perHal));
  const hal=Math.min(u.hal||1,total), baris=potongHal(list,hal,perHal);
  return `
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
    ${kartuKPI({ikon:"orang",label:"Karyawan Aktif",nilai:d().karyawan.filter(k=>k.aktif).length,ket:`${d().karyawan.length} total terdaftar`,nada:"brand"})}
    ${kartuKPI({ikon:"gedung",label:"Departemen",nilai:d().departemen.length,ket:"Unit kerja",nada:"biru"})}
    ${kartuKPI({ikon:"lapis",label:"Kelompok",nilai:d().kelompok.length,ket:"Dasar plot budget",nada:"ungu"})}
    ${kartuKPI({ikon:"arsip",label:"Non-aktif",nilai:d().karyawan.filter(k=>!k.aktif).length,ket:"Data tetap tersimpan",nada:"abu"})}
  </div>
  <div class="kartu">
    <div class="kartu-kepala flex-wrap gap-3">
      <div class="flex flex-wrap items-end gap-2">
        <div class="cari-bungkus">${ikon("cari",15,"ikon-kiri")}
          <input class="inp" placeholder="Cari nama atau NIK" value="${esc(u.cari||"")}" data-aksi="kar-cari"></div>
        <label class="blok w-auto"><span class="label">Departemen</span>
          ${pilih("dept",u.dept,[{v:"semua",l:"Semua"},...d().departemen.map(x=>({v:x.kode,l:x.nama}))],{aksi:"kar-dept"})}</label>
        <label class="blok w-auto"><span class="label">Kelompok</span>
          ${pilih("kel",u.kel,[{v:"semua",l:"Semua"},...d().kelompok.map(x=>({v:x.kode,l:x.nama}))],{aksi:"kar-kel"})}</label>
        <label class="blok w-auto"><span class="label">Keaktifan</span>
          ${pilih("aktif",u.aktif,[{v:"aktif",l:"Aktif"},{v:"nonaktif",l:"Non-aktif"},{v:"semua",l:"Semua"}],{aksi:"kar-aktif"})}</label>
      </div>
      <div class="flex items-end gap-2">
        ${tombol("Export Excel",{ikon:"excel",aksi:"kar-export"})}
        ${tombol("Tambah Karyawan",{jenis:"utama",ikon:"plus",aksi:"kar-baru"})}
      </div>
    </div>
    ${baris.length?`<div class="tabel-bungkus"><table class="tabel">
      <thead><tr><th>NIK</th><th>Nama</th><th>Departemen</th><th>Kelompok</th><th>Divisi/Job Title</th><th>Status</th><th class="tg">Shift</th><th class="ka">Aksi</th></tr></thead>
      <tbody>${baris.map(k=>`<tr class="${!k.aktif?"baris-redup":""}">
        <td class="font-mono txt2">${esc(k.nik)}</td>
        <td><div class="flex items-center gap-2.5">${avatar(k.nama,"sm")}
          <span class="txt font-medium">${esc(k.nama)}</span>
          ${!k.aktif?lencana("Non-aktif","abu"):""}</div></td>
        <td class="txt2">${esc(namaDept(k.dept))}</td>
        <td><span class="kode-pil">${esc(namaKelompok(k.kelompok))}</span></td>
        <td class="txt2 text-[12.5px]">${esc(k.jabatan)}</td>
        <td>${lencana(k.status,"biru")}</td>
        <td class="tg"><span class="kode-pil">${esc(k.shift)}</span></td>
        <td class="ka"><div class="flex justify-end gap-1">
          ${tombolIkon("pensil",`Ubah ${k.nama}`,{aksi:"kar-ubah",data:{nik:k.nik}})}
          ${tombolIkon(k.aktif?"silangBulat":"ceklisBulat",k.aktif?"Nonaktifkan":"Aktifkan kembali",
            {aksi:"kar-toggle",data:{nik:k.nik},nada:k.aktif?"merah":"hijau"})}
        </div></td></tr>`).join("")}</tbody></table></div>
      ${halamanNav({hal,total,jumlah:`Menampilkan ${baris.length} dari ${list.length} karyawan`,aksiPrev:"kar-hal-prev",aksiNext:"kar-hal-next"})}`
      :kosong("orang","Karyawan tidak ditemukan","Ubah kata kunci atau saringan yang dipakai.")}
  </div>`;
}

function halamanDepartemen() {

const SUB_ATURAN = ["lembur","tunjangan","kode","kelompok","status","periode","umum"];

/** Nilai yang ditampilkan: salinan sementara bila sedang diubah. */
function nilaiUbah() {
  const u = state.ui.set;
  return (u && u.ubah && u.draft) ? u.draft : { pengaturan: pengaturan(), kodeAbsen: d().kodeAbsen, kelompok: d().kelompok, statusKaryawan: d().statusKaryawan };
}
const sedangUbah = () => !!(state.ui.set && state.ui.set.ubah);

/** Bilah aksi Ubah / Simpan / Batal, tampil pada setiap sub-bagian. */
function bilahAksi(judul, ket) {
  const ubah = sedangUbah();
  return `<div class="bilah-ubah ${ubah?"bilah-aktif":""}">
    <div class="min-w-0">
      <p class="txt text-[13.5px] font-semibold">${esc(judul)}</p>
      <p class="txt3 text-[12px] mt-0.5">${ubah?"Perubahan belum tersimpan.":esc(ket)}</p>
    </div>
    <div class="flex gap-2 ml-auto shrink-0">
      ${ubah
        ? tombol("Batal",{aksi:"set-batal"}) + tombol("Simpan Perubahan",{jenis:"utama",ikon:"simpan",aksi:"set-simpan"})
        : tombol("Ubah",{jenis:"utama",ikon:"pensil",aksi:"set-ubah-mulai"})}
    </div>
  </div>`;
}
function halamanPengaturan() {
  if (!state.ui.set) state.ui.set = { ubah:false, draft:null };
  const tab = state.setTab;
  const v = nilaiUbah();
  const ket = {
    lembur:"Cara sistem mengenali dan menghitung lembur.",
    tunjangan:"Nominal dan syarat kelayakan tunjangan.",
    kode:"Daftar kode absensi dasar beserta jadwalnya.",
    kelompok:"Kelompok absensi sebagai dasar plot budget.",
    status:"Daftar status kepegawaian.",
    periode:"Tanggal periode dan jadwal closing.",
    umum:"Pengaturan umum aplikasi.",
  }[tab] || "";
  const isi = tab==="lembur"?tabLembur(v.pengaturan) : tab==="tunjangan"?tabTunjangan(v.pengaturan)
    : tab==="kode"?tabKode(v.kodeAbsen) : tab==="kelompok"?tabKelompok(v.kelompok)
    : tab==="status"?tabStatus(v.statusKaryawan) : tab==="periode"?tabPeriode(v.pengaturan) : tabUmum(v.pengaturan);
  return `${bilahAksi(JUDUL_SUB[tab]||"Pengaturan", ket)}<div class="mt-3">${isi}</div>`;
}

};

let sedangGambar = false;
function render() {
  const akar = document.getElementById("app");
  if (!akar || sedangGambar) return;
  sedangGambar = true;
  try { gambar(akar); } finally { sedangGambar = false; }
}
function gambar(akar) {
  const f = document.activeElement;
  const idF = f && f.dataset ? f.dataset.aksi : null;
  const namaF = f && f.name ? f.name : null;
  const pos = f && typeof f.selectionStart === "number" ? f.selectionStart : null;
  akar.innerHTML = (state.masuk ? kerangka((HALAMAN[state.halaman] || halamanDashboard)()) : halamanMasuk())
    + (state.modal ? modalKotak(state.modal) : "") + toastHtml();
  if (idF) {
    const pilihan = namaF ? `[data-aksi="${idF}"][name="${namaF}"]` : `[data-aksi="${idF}"]`;
    const el = akar.querySelector(pilihan) || akar.querySelector(`[data-aksi="${idF}"]`);
    if (el && el.focus) {
      el.focus();
      if (pos != null && el.setSelectionRange) { try { el.setSelectionRange(pos, pos); } catch (e) { /* bukan teks */ } }
    }
  }
}
window.render = render;

const bukaModal = (m) => { state.modal = m; render(); };
const tutupModal = () => { state.modal = null; render(); };
const nilaiForm = (form) => { const o = {}; new FormData(form).forEach((v,k)=>{ o[k] = typeof v==="string"?v.trim():v; }); return o; };
const formAktif = () => document.querySelector(".modal-panel form") || document.querySelector("form");
const angka = (v, b = 0) => { const n = Number(v); return Number.isFinite(n) ? n : b; };
function catatRiwayat(a, teks) {
  a.riwayat = a.riwayat || [];
  a.riwayat.unshift({ teks, oleh: state.pengguna?state.pengguna.nama:"Sistem", pada: new Date().toISOString() });
  a.riwayat = a.riwayat.slice(0, 12);
}

/* -- Masuk / keluar / navigasi -- */

/* -- Import -- */
AKSI["imp-pilih-berkas"] = () => document.getElementById("berkasLog").click();
/** Membaca berkas log (dari dialog pilih berkas maupun seret-lepas). */
function bacaBerkasLog(f) {
  if (!f) return;
  const galat = (pesan) => { toast(pesan, "galat"); render(); };   // toast tidak menggambar ulang layar sendiri
  const r = new FileReader();
  r.onerror = () => galat("Berkas tidak dapat dibaca.");
  r.onload = () => {
    try {
      const hasil = parseLogMesin(String(r.result));
      if (!hasil.log.length) { galat("Tidak ada data log yang dikenali. Gunakan berkas attlog (.dat) dari mesin atau CSV berkolom PIN dan DateTime."); return; }
      siapkanDraft(hasil, f.name);
    } catch (e) { console.error(e); galat("Berkas gagal dibaca. Periksa kembali susunan berkasnya."); }
  };
  r.readAsText(f);
}
AKSI["imp-berkas"] = (el) => { const f = el.files && el.files[0]; el.value = ""; bacaBerkasLog(f); };
AKSI["imp-contoh"] = () => {
  const u = state.ui.imp;
  if (u.dari > u.sampai) { toast("Tanggal awal melewati tanggal akhir.", "galat"); render(); return; }
  const teks = buatLogContoh(d().karyawan, u.dari, u.sampai, d().hariLibur);
  siapkanDraft(parseLogMesin(teks), `Data contoh ${tglPendek(u.dari)} sampai ${tglPendek(u.sampai)}`);
};
function siapkanDraft(hasil, nama, opsi = {}) {
  const u = state.ui.imp;
  u.log = hasil.log; u.meta = hasil.meta; u.namaBerkas = nama;
  const info = {};
  u.draft = susunDraftAbsensi(hasil.log, konteks(), info);
  u.info = info; u.hal = 1; u.saring = "semua";
  if (!opsi.diam) toast(`${hasil.meta.jumlah} scan terbaca, ${u.draft.length} baris absensi tersusun.`, "sukses");
  render();
}
AKSI["imp-pakai-selisih"] = () => {
  const u = state.ui.imp; if (!u || !u.log) return;
  pengaturan().sumberLembur = "selisih-jam";
  catatAktivitas("roda", "Sumber deteksi lembur diubah", "Diubah ke selisih jam pulang dari halaman import karena berkas tidak memuat scan OT.");
  siapkanDraft({ log: u.log, meta: u.meta }, u.namaBerkas, { diam: true });
  toast("Lembur kini dihitung dari selisih jam pulang. Draft disusun ulang.", "sukses");
};
AKSI["imp-rentang"] = (el) => { state.ui.imp[el.name] = el.value; };
AKSI["imp-ke-1"] = () => { state.ui.imp.langkah = 1; render(); };
AKSI["imp-ke-2"] = () => { if (state.ui.imp.draft) { state.ui.imp.langkah = 2; render(); } };
AKSI["imp-saring"] = (el) => { state.ui.imp.saring = el.dataset.v; state.ui.imp.hal = 1; render(); };
AKSI["imp-hal-prev"] = () => { state.ui.imp.hal = Math.max(1,(state.ui.imp.hal||1)-1); render(); };
AKSI["imp-hal-next"] = () => { state.ui.imp.hal = (state.ui.imp.hal||1)+1; render(); };
AKSI["imp-ulang"] = () => { state.ui.imp = { langkah:1, dari:"2026-09-01", sampai:"2026-09-15", hal:1, saring:"semua" }; render(); };
AKSI["imp-proses"] = () => {
  const u = state.ui.imp;
  const peta = new Map(d().absensi.map(a => [a.id, a]));
  let baru=0, perbarui=0, lewat=0, terkunciLewat=0;
  u.draft.forEach(x => {
    if (x.nikTidakDikenal) { lewat++; return; }
    if (terkunci(x.tanggal)) { terkunciLewat++; return; }
    const ada = peta.get(x.id);
    if (ada) {
      if (ada.statusVerifikasi === "disetujui" || ada.statusVerifikasi === "ditolak") return;
      Object.assign(ada, x, { riwayat: ada.riwayat || [] }); perbarui++;
    } else { d().absensi.push(x); peta.set(x.id, x); baru++; }
  });
  let dilengkapi = 0;
  ((u.info && u.info.lanjutan) || []).forEach(x => {
    const ada = cariBarisTerbuka(d().absensi, x) || peta.get(x.id);
    if (ada) { if (!terkunci(ada.tanggal) && lengkapiPulang(ada, x.jamPulang, konteks(), x.abs)) dilengkapi++; }
    else if (x.cadangan && !x.cadangan.nikTidakDikenal && !terkunci(x.cadangan.tanggal)) {
      d().absensi.push(x.cadangan); peta.set(x.cadangan.id, x.cadangan); baru++;   // tidak ada baris yang cocok: buat baris untuk diperiksa
    }
  });
  d().absensi.sort((a,b)=>a.tanggal.localeCompare(b.tanggal)||a.nama.localeCompare(b.nama));
  const perlu = d().absensi.filter(a=>a.statusVerifikasi==="perlu-verifikasi").length;
  u.hasil = { baru, perbarui, lewat: lewat+terkunciLewat, perlu, dilengkapi };
  u.langkah = 3;
  const tgl=[...new Set(u.draft.map(x=>x.tanggal))].sort();
  d().riwayatImport.unshift({ berkas:u.namaBerkas, dari:tgl[0], sampai:tgl[tgl.length-1],
    baris:u.draft.length, baru, diperbarui:perbarui, oleh:state.pengguna.nama, pada:new Date().toISOString() });
  catatAktivitas("unggah","Import absensi",`${baru} baris baru, ${perbarui} diperbarui dari ${u.namaBerkas}`);
  simpanData(); render();
  if (terkunciLewat) toast(`${terkunciLewat} baris dilewati karena periodenya terkunci final.`, "info");
  if (pengaturan().ingatkanBackup === "setiap-import") setTimeout(()=>toast("Jangan lupa mencadangkan data setelah import.","info"), 900);
};

function simpanBaris(a) {
  const form = formAktif(); if (!form) return [];
  const v = nilaiForm(form);
  const seb = { k:a.kodeDasar, kel:a.kelompok, lm:a.lemburMasuk, lp:a.lemburPulang };
  a.kodeDasar = v.kodeDasar || a.kodeDasar;
  a.kelompok = v.kelompok || a.kelompok;
  a.lemburMasuk = v.lemburMasuk ? v.lemburMasuk+":00" : "";
  a.lemburPulang = v.lemburPulang ? v.lemburPulang+":00" : "";
  a.lemburIstirahat = v.istirahat === "" ? null : angka(v.istirahat, 0);
  a.catatan = v.catatan || "";
  hitungLembur(a, pengaturan(), d().kodeAbsen);
  const ubah = [];
  if (seb.k !== a.kodeDasar) ubah.push(`kode ${seb.k} menjadi ${a.kodeDasar}`);
  if (seb.kel !== a.kelompok) ubah.push(`kelompok ${namaKelompok(seb.kel)} menjadi ${namaKelompok(a.kelompok)}`);
  if (seb.lm !== a.lemburMasuk || seb.lp !== a.lemburPulang) ubah.push("jam lembur disesuaikan");
  return ubah;
}

AKSI["lib-massal-kirim"] = () => {
  const form = formAktif(); if (!form) return;
  const teks = (nilaiForm(form).teks||"").trim();
  if (!teks) { toast("Belum ada data yang ditempel.","galat"); return; }
  let masuk=0, lewat=0;
  teks.split("\n").forEach(b=>{
    const p = b.split(",").map(x=>x.trim());
    if (p.length < 2) { lewat++; return; }
    let [tgl,ket,tipe] = p;
    if (/^\d{2}-\d{2}-\d{4}$/.test(tgl)) tgl = tgl.split("-").reverse().join("-");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(tgl) || !ket) { lewat++; return; }
    d().hariLibur.push({ tanggal:tgl, ket, tipe: /nas/i.test(tipe||"") ? "Nasional" : "Perusahaan" });
    masuk++;
  });
  d().hariLibur.sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
  simpanData(); tutupModal();
  toast(`${masuk} hari libur ditambahkan${lewat?`, ${lewat} baris dilewati`:""}.`, masuk?"sukses":"galat");
};

    kaki:`${tombol("Batal",{aksi:"modal-tutup"})}${tombol("Simpan",{jenis:"utama",ikon:"simpan",aksi:"kod-kirim"})}` });
};
AKSI["kod-ubah"] = (el) => {
  const k = nilaiUbah().kodeAbsen.find(x=>x.kode===el.dataset.kode); if (!k) return;
  state.ui.galatKod = {};
  bukaModal({ judul:"Ubah Kode Absensi", ket:`${k.kode}, ${k.nama}`, isi:formKode(k), lebar:"max-w-2xl",
    kaki:`${tombol("Batal",{aksi:"modal-tutup"})}${tombol("Simpan Perubahan",{jenis:"utama",ikon:"simpan",aksi:"kod-kirim"})}` });
};
AKSI["kod-kirim"] = () => {
  const form = formAktif(); if (!form) return;
  const v = nilaiForm(form);
  const daftar = nilaiUbah().kodeAbsen;
  const baru = form.dataset.baru === "1", lama = form.dataset.kodeLama;
  const g = {};
  if (!v.kode) g.kode = "Kode wajib diisi.";
  else if (daftar.some(x=>x.kode===v.kode && (baru||x.kode!==lama))) g.kode = "Kode sudah dipakai.";
  if (!v.nama) g.nama = "Keterangan wajib diisi.";
  if (Object.keys(g).length) { state.ui.galatKod = g; state.modal.isi = formKode(baru?v:{...daftar.find(x=>x.kode===lama),...v}); return render(); }
  const data = { kode:v.kode, nama:v.nama, masuk:v.masuk||"", keluar:v.keluar||"",
    istirahat:angka(v.istirahat,0), hitungHari:v.hitungHari==="1",
    uangShift:angka(v.uangShift,0), rumus:v.rumus, jenis:v.jenis };
  if (baru) daftar.push(data);
  else Object.assign(daftar.find(x=>x.kode===lama), data);
  tutupModal(); toast("Kode tersimpan pada salinan. Tekan Simpan Perubahan agar berlaku.","info");
};
AKSI["kod-hapus"] = (el) => {
  const kode = el.dataset.kode;
  const dipakai = d().absensi.filter(a=>a.kodeDasar===kode).length;
  if (dipakai) { toast(`Tidak dapat dihapus, dipakai pada ${dipakai} baris absensi.`,"galat"); return; }
  const u = nilaiUbah();
  u.kodeAbsen = u.kodeAbsen.filter(x=>x.kode!==kode);
  state.ui.set.draft.kodeAbsen = u.kodeAbsen;
  render(); toast(`Kode ${kode} dihapus pada salinan.`,"info");
};

/* -- Backup & restore -- */
AKSI["cad-unduh"] = () => {
  d().backupTerakhir = new Date().toISOString();
  const isi = JSON.stringify({ aplikasi:APP.nama, versi:APP.versi, dibuat:new Date().toISOString(), data:d() }, null, 2);
  unduhBlob(`Cadangan ${APP.nama} ${tglStrip(toISO(new Date()))}.json`, new Blob([isi],{type:"application/json"}));
  simpanData(); render(); toast("Berkas cadangan berhasil diunduh.","sukses");
};
AKSI["cad-pulihkan"] = () => document.getElementById("berkasCadangan").click();
AKSI["cad-berkas"] = (el) => {
  const f = el.files && el.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(String(r.result));
      const isi = j.data || j;
      if (!isi.karyawan || !isi.kodeAbsen) throw new Error("struktur tidak dikenali");
      state.data = { ...state.data, ...isi };
      simpanData(); state.ui = {}; render();
      toast("Data berhasil dipulihkan dari berkas cadangan.","sukses");
    } catch (e) { toast("Berkas cadangan tidak valid.","galat"); }
  };
  r.readAsText(f);
};
AKSI["cad-reset"] = () => {
  bukaModal({ judul:"Setel Ulang Aplikasi", ket:"Tindakan ini tidak dapat dibatalkan",
    isi:`<p class="txt2 text-[13px] leading-relaxed">Seluruh data absensi, hasil verifikasi, riwayat periode, dan perubahan pengaturan akan dihapus dari perangkat ini. Data master karyawan dikembalikan ke kondisi awal.</p>
      <div class="kotak-bahaya mt-4">${ikon("peringatan",16,"shrink-0 mt-0.5")}<p class="text-[12px] leading-relaxed">Pastikan berkas cadangan sudah diunduh sebelum melanjutkan.</p></div>`,
    kaki:`${tombol("Batal",{aksi:"modal-tutup"})}${tombol("Ya, Setel Ulang",{jenis:"bahaya",ikon:"putar",aksi:"cad-reset-ya"})}` });
};
AKSI["cad-reset-ya"] = () => {

};

/* ---------------- Pendengar peristiwa ---------------- */
function jalankan(el, ev) { const fn = AKSI[el.dataset.aksi]; if (fn) fn(el, ev); }
function pasangPendengar() {
  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-aksi]"); if (!el) return;
    if (["FORM","INPUT","SELECT","TEXTAREA"].includes(el.tagName)) return;
    if (el.disabled || el.classList.contains("nonaktif")) return;
    jalankan(el, ev);
  });
  document.addEventListener("change", (ev) => {
    const el = ev.target.closest("[data-aksi]"); if (!el || el.disabled) return;
    if (el.tagName === "SELECT" || ["date","file","number"].includes(el.type)) jalankan(el, ev);
  });
  document.addEventListener("input", (ev) => {
    const el = ev.target.closest("[data-aksi]"); if (!el || el.disabled) return;
    if (el.tagName === "INPUT" && ["text","search","number",""].includes(el.type || "")) jalankan(el, ev);
  });
  document.addEventListener("submit", (ev) => {
    const el = ev.target.closest("form[data-aksi]"); if (!el) return;
    ev.preventDefault(); jalankan(el, ev);
  });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && state.modal) tutupModal(); });

  // Seret-lepas berkas log. Di luar area unggah, cegah browser membuka berkas dan meninggalkan aplikasi.
  const adaBerkas = (ev) => ev.dataTransfer && [...(ev.dataTransfer.types || [])].includes("Files");
  const areaUnggah = (ev) => ev.target.closest ? ev.target.closest(".drop-area") : null;
  document.addEventListener("dragover", (ev) => {
    if (!adaBerkas(ev)) return;
    ev.preventDefault();
    document.querySelectorAll(".drop-area.drop-aktif").forEach(z => { if (z !== areaUnggah(ev)) z.classList.remove("drop-aktif"); });
    const z = areaUnggah(ev); if (z) z.classList.add("drop-aktif");
  });
  document.addEventListener("dragleave", (ev) => {
    if (ev.relatedTarget === null) document.querySelectorAll(".drop-area.drop-aktif").forEach(z => z.classList.remove("drop-aktif"));
  });
  document.addEventListener("drop", (ev) => {
    if (!adaBerkas(ev)) return;
    ev.preventDefault();
    document.querySelectorAll(".drop-area.drop-aktif").forEach(z => z.classList.remove("drop-aktif"));
    if (areaUnggah(ev) && state.ui.imp) bacaBerkasLog(ev.dataTransfer.files[0]);
  });
}
function mulai() { muatData(); pasangPendengar(); render(); }


/* ===== mulai ===== */
mulai();
